name: Update sheets

on:
  schedule:
    # Twice daily; the commit step publishes only when sheet data actually changed.
    - cron: '23 3,15 * * *'
    # Hourly 10:45-15:45 UTC Wednesdays (the game-update window)
    - cron: '45 10-15 * * 3'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-sheets

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: gradle/actions/wrapper-validation@v6

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      - name: Scrape the wiki
        run: |
          pip install requests
          python scripts/wiki_items_query.py
          python scripts/wiki_pets_query.py

      - name: Generate sheets
        run: |
          git clone --depth 1 https://github.com/abextm/osrs-cache.git
          CACHEVER="$(git -C osrs-cache log -1 --format='%h %s')"
          ./gradlew run --args="--cache osrs-cache --cache-version '$CACHEVER' --wiki-items osrs_wiki_items.json --wiki-pets osrs_wiki_pets.json --out v1"
          echo "CACHEVER=$CACHEVER" >> "$GITHUB_ENV"

      # A wiki outage returning empty results must fail loudly, not publish shrunken sheets.
      - name: Sanity-check row counts
        run: |
          floor() {
            n=$(grep -cv '^#' "v1/$1.csv")
            echo "$1: $n rows"
            [ "$n" -ge "$2" ] || { echo "::error::$1 has $n rows, floor is $2"; exit 1; }
          }
          floor item_sheet 15000
          floor npc_sheet 6000
          floor stack_variant_sheet 1300
          floor pet_sheet 190

      # Provenance headers change every run; they alone are not worth a commit.
      - name: Commit and push
        run: |
          if git diff --quiet -I '^# cache: ' -I '^# wiki ' -- v1; then
            echo "No data changes."
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add v1
          git commit -m "Update sheets: $CACHEVER"
          git push
